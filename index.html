<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presensi MUBES HIMAFORKA XXI</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
        }
      }
    </script>
  </head>
  <body class="login-page">
    <div id="loadingOverlay" class="loading-overlay" style="display: none">
      <div class="loading-spinner"></div>
      <p>Memuat...</p>
    </div>

    <div class="login-shapes">
      <div class="login-shape login-shape-1"></div>
      <div class="login-shape login-shape-2"></div>
      <div class="login-shape login-shape-3"></div>
    </div>

    <div class="login-container">
      <div class="login-card">
        <div class="login-brand">
          <div class="login-brand-icon">
            <i class="bi bi-check-circle-fill"></i>
          </div>
          <h1>PRESENSI</h1>
          <p>PANITIA MUSYAWARAH BESAR HIMAFORKA XXI</p>
        </div>

        <form id="loginForm" class="login-form" autocomplete="off">
          <div class="form-group">
            <label for="username">
              <i class="bi bi-person-fill"></i> Username
            </label>
            <input
              type="text"
              id="username"
              name="username"
              class="input"
              placeholder="Masukkan Nama atau Email"
              required
              autocomplete="username"
            />
          </div>

          <div class="form-group">
            <label for="password">
              <i class="bi bi-lock-fill"></i> Password
            </label>
            <div class="password-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                class="input"
                placeholder="Masukkan NIM atau Password"
                required
                autocomplete="current-password"
              />
              <button
                type="button"
                class="password-toggle"
                id="passwordToggle"
                aria-label="Tampilkan password"
              >
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div id="loginError" class="form-error" style="display: none"></div>

          <button type="submit" id="loginBtn" class="btn btn-primary btn-full">
            <i class="bi bi-box-arrow-in-right"></i> Masuk
          </button>
        </form>

        <p class="login-footer">&copy; 2026 HIMAFORKA XXI</p>
      </div>
    </div>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
