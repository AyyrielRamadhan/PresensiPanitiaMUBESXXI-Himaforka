<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presensi — MUBES HIMAFORKA XXI</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/attendance.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="loadingOverlay" class="loading-overlay" style="display: none">
      <div class="loading-spinner"></div>
      <p>Memuat...</p>
    </div>

    <div class="attendance-page">
      <div class="attendance-container">
        <div class="attendance-card">
          <div class="attendance-header">
            <div class="attendance-header-icon">
              <i class="bi bi-check-circle-fill"></i>
            </div>
            <h2>Presensi</h2>
            <p>MUBES HIMAFORKA XXI</p>
          </div>

          <form id="attendanceForm" autocomplete="off" novalidate>
            <div class="form-group">
              <label for="nama">
                <i class="bi bi-person-fill"></i> Nama Lengkap
              </label>
              <input
                type="text"
                id="nama"
                name="nama"
                placeholder="Masukkan nama lengkap"
                class="input"
                required
              />
              <span class="form-error-msg" id="namaError"></span>
            </div>

            <div class="form-group">
              <label for="nim"> <i class="bi bi-card-text"></i> NIM </label>
              <input
                type="text"
                id="nim"
                name="nim"
                placeholder="Masukkan NIM (angka)"
                class="input"
                required
                inputmode="numeric"
              />
              <span class="form-error-msg" id="nimError"></span>
            </div>

            <div class="form-group">
              <label for="divisi">
                <i class="bi bi-building"></i> Divisi / Jabatan
              </label>
              <select id="divisi" name="divisi" class="input" required>
                <option value="">— Pilih Divisi —</option>
                <option value="Ketua Panitia">Ketua Panitia</option>
                <option value="Sekretaris">Sekretaris</option>
                <option value="Bendahara">Bendahara</option>
                <option value="Sie Acara">Sie Acara</option>
                <option value="Sie Humas">Sie Humas</option>
                <option value="Sie Perlengkapan">Sie Perlengkapan</option>
                <option value="Sie Konsumsi">Sie Konsumsi</option>
                <option value="Sie PDD">Sie PDD</option>
              </select>
              <span class="form-error-msg" id="divisiError"></span>
            </div>

            <div class="form-divider">
              <span>Metode Presensi</span>
            </div>

            <div class="scanner-section">
              <div class="scanner-toggle-row">
                <button
                  type="button"
                  id="scanBtn"
                  class="btn btn-primary btn-sm"
                >
                  <i class="bi bi-camera"></i> Scan QR
                </button>
                <button
                  type="button"
                  id="stopScanBtn"
                  class="btn btn-danger btn-sm"
                  style="display: none"
                >
                  <i class="bi bi-stop-circle"></i> Hentikan
                </button>
              </div>

              <div class="card">
                <div id="scannerContainer">
                  <div class="scanner-placeholder" id="scannerPlaceholder">
                    <i class="bi bi-camera-fill"></i>
                    <p>Klik scan untuk memulai kamera</p>
                  </div>
                </div>
                <div
                  id="scannerResult"
                  class="scanner-status inactive"
                  style="display: none; margin-top: 12px"
                >
                  <i class="bi bi-check-circle-fill"></i>
                  Token: <strong id="scannedToken">-</strong>
                </div>
              </div>
            </div>

            <div class="form-or">
              <span>atau</span>
            </div>

            <div class="form-group">
              <label for="token">
                <i class="bi bi-key-fill"></i> Token Manual
              </label>
              <input
                type="text"
                id="token"
                name="token"
                placeholder="Masukkan token 6 digit"
                class="input"
                maxlength="6"
                autocomplete="off"
                inputmode="numeric"
                style="
                  letter-spacing: 4px;
                  font-weight: 700;
                  text-align: center;
                  font-family: monospace;
                "
              />
              <span class="form-error-msg" id="tokenError"></span>
            </div>

            <button
              type="submit"
              id="presensiBtn"
              class="btn btn-primary btn-full btn-large"
            >
              <i class="bi bi-check-lg"></i> Presensi
            </button>
          </form>

          <div
            id="successState"
            class="attendance-success"
            style="display: none"
          >
            <div class="attendance-success-icon">
              <i class="bi bi-check-circle-fill"></i>
            </div>
            <h3>Presensi Berhasil!</h3>
            <p
              id="successMessage"
              style="color: var(--gray-500); font-size: 14px"
            >
              Data Anda telah tercatat.
            </p>
            <button id="resetFormBtn" class="btn btn-primary">
              <i class="bi bi-arrow-repeat"></i> Presensi Lagi
            </button>
          </div>
        </div>

        <p class="login-footer" style="margin-top: 16px">
          <a href="index.html"
            ><i class="bi bi-arrow-left"></i> Kembali ke Beranda</a
          >
        </p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/utils.js"></script>
    <script type="module" src="js/validation.js"></script>
    <script type="module" src="js/scanner.js"></script>
    <script type="module" src="js/attendance.js"></script>
  </body>
</html>
